name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package Win64 portable zip and checksums
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -f "release/Virela-win64/Virela.exe"
          ZIP_NAME="Virela-${TAG_NAME}-win64-portable.zip"
          SUM_NAME="Virela-${TAG_NAME}-SHA256SUMS.txt"
          (cd release && zip -qr "../${ZIP_NAME}" Virela-win64)
          sha256sum "${ZIP_NAME}" > "${SUM_NAME}"
          git for-each-ref --format='%(contents)' "refs/tags/${TAG_NAME}" > release_notes.md || true
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "SUM_NAME=${SUM_NAME}" >> "$GITHUB_ENV"
          ls -lh "${ZIP_NAME}" "${SUM_NAME}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_NAME}" "${SUM_NAME}" --clobber
          else
            if [ -s release_notes.md ]; then
              gh release create "${TAG_NAME}" "${ZIP_NAME}" "${SUM_NAME}" \
                --title "Virela ${TAG_NAME}" \
                --notes-file release_notes.md
            else
              gh release create "${TAG_NAME}" "${ZIP_NAME}" "${SUM_NAME}" \
                --title "Virela ${TAG_NAME}" \
                --generate-notes
            fi
          fi
